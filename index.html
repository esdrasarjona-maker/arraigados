<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6EE">
<meta name="description" content="Arraigados: un camino de discipulado bíblico. Gratis y sin ánimo de lucro.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arraigados">
<title>Arraigados</title>

<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: el árbol es la pantalla principal; cada parte abre una hoja a pantalla completa con cabecera ilustrada */
:root{
  --bg:#F4F6EE; --surface:#FFFFFF; --surface-2:#E8EEDF;
  --ink:#16221A; --muted:#55645A; --line:#CDD5C5;
  --accent:#4C8A44; --accent-ink:#FFFFFF; --accent-soft:#E0EDD6;
  --gold:#A9781E; --gold-soft:#F3E5C0; --danger:#9C3B2C;
  --c-mana:#D99224; --c-palabra:#2F7FB3; --c-oracion:#7A4E93; --c-memoria:#4C8C3A; --c-fruto:#D0573A; --c-fund:#7A5636; --c-roca:#6F6B62; --c-piedras:#A08245; --c-disc:#2E7C78; --c-dicc:#3D4F8F; --c-cree:#6E5A8A; --c-raz:#A2532E;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-heb:"Noto Serif Hebrew", "Times New Roman", serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1310; --surface:#161E18; --surface-2:#1F2921;
  --ink:#E6ECE3; --muted:#9AA99D; --line:#2C392E;
  --accent:#8EBC78; --accent-ink:#0E1A0F; --accent-soft:#223322;
  --gold:#E1B458; --gold-soft:#3A2F16; --danger:#E08573;
  --c-mana:#E9A93A; --c-palabra:#5BA9DA; --c-oracion:#B58BD0; --c-memoria:#86C46D; --c-fruto:#EF8565; --c-fund:#C29B74; --c-roca:#ABA69B; --c-piedras:#D2B577; --c-disc:#5BC0BA; --c-dicc:#8C9EE0; --c-cree:#B39BD6; --c-raz:#E58A5E; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1310; --surface:#161E18; --surface-2:#1F2921;
  --ink:#E6ECE3; --muted:#9AA99D; --line:#2C392E;
  --accent:#8EBC78; --accent-ink:#0E1A0F; --accent-soft:#223322;
  --gold:#E1B458; --gold-soft:#3A2F16; --danger:#E08573;
  --c-mana:#E9A93A; --c-palabra:#5BA9DA; --c-oracion:#B58BD0; --c-memoria:#86C46D; --c-fruto:#EF8565; --c-fund:#C29B74; --c-roca:#ABA69B; --c-piedras:#D2B577; --c-disc:#5BC0BA; --c-dicc:#8C9EE0; --c-cree:#B39BD6; --c-raz:#E58A5E; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.18;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}

/* ---------- Inicio ---------- */
#home{max-width:560px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:8px calc(28px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.brand svg{width:28px;height:28px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:21px;height:21px}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.hello h1{font-size:1.45rem}
.stagechip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.8rem;font-weight:700}
.stagechip i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.scene-wrap{position:relative;border-radius:28px;overflow:hidden;box-shadow:0 18px 40px -22px rgba(20,40,20,.55),0 0 0 1px rgba(0,0,0,.04)}
.scene{display:block;width:100%;height:auto;max-width:100%;aspect-ratio:400/540}
.hit{cursor:pointer}
.tag{cursor:pointer}
.tag rect{filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.tag:focus-visible{outline:none}.tag:focus-visible rect{stroke:#16221A;stroke-width:2}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(16,24,18,.72);color:#fff;font-size:.78rem;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap;pointer-events:none}

.today{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tb{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 6px 12px;min-width:0}
.tb-c{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--k);background:color-mix(in srgb,var(--k) 14%,transparent);position:relative}
.tb-c svg{width:26px;height:26px}
.tb.done .tb-c{background:var(--k);color:#fff}
.tb-c b{position:absolute;right:-2px;top:-2px;width:20px;height:20px;border-radius:50%;background:var(--surface);display:grid;place-items:center;border:2px solid var(--k)}
.tb-c b svg{width:11px;height:11px;color:var(--k)}
.tb-l{font-weight:800;font-size:.9rem}
.tb-s{font-size:.74rem;color:var(--muted);text-align:center;line-height:1.25}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;min-width:0}
.tile-ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--k);font-family:var(--f-heb);font-size:1.25rem;font-weight:600}
.tile-ic svg{width:22px;height:22px}
.tile b{display:block;font-size:.92rem}
.tile span{font-size:.76rem;color:var(--muted)}
.nextroot{display:flex;align-items:center;gap:14px;width:100%;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left}
.nextroot .n{flex:none;width:40px;height:40px;border-radius:12px;background:var(--c-fund);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.foot{font-size:.8rem;color:var(--muted);text-align:center;padding:16px 10px 0;max-width:44ch;margin:0 auto}

/* ---------- Hojas ---------- */
#sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:620px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:12px 20px 24px;color:var(--ink);background:linear-gradient(160deg,color-mix(in srgb,var(--k) 26%,var(--surface)) 0%,color-mix(in srgb,var(--k) 9%,var(--surface)) 85%);border:1px solid color-mix(in srgb,var(--k) 22%,transparent);margin-bottom:16px;box-shadow:0 16px 36px -24px rgba(0,0,0,.6)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 100% 0%,rgba(255,255,255,.5),transparent 60%);pointer-events:none}
.hero h1{color:var(--ink)}
.hero>*{position:relative}
.hero .back{color:var(--ink)}
.hero-art{position:absolute;right:-6px;top:26px;width:110px;height:110px;opacity:.32;pointer-events:none;filter:drop-shadow(0 0 0 var(--k))}
.hero-art svg *{fill:color-mix(in srgb,var(--k) 55%,transparent)!important;stroke:color-mix(in srgb,var(--k) 55%,transparent)!important}
.hero-art svg text{stroke:none!important}
.hero .eyebrow{color:color-mix(in srgb,var(--k) 70%,var(--ink));margin-top:18px}
.hero h1{font-size:2rem;margin-top:4px;max-width:14ch}
.hero-v{font-family:var(--f-display);font-style:italic;font-size:1.04rem;line-height:1.55;margin-top:14px;max-width:44ch;color:var(--ink)}
.hero-ref{margin-top:6px;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:8px 2px;font-weight:700;color:var(--ink)}
.back svg{width:20px;height:20px}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:4px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{font-size:1.25rem}
.prose{display:flex;flex-direction:column;gap:14px;font-size:1.03rem;line-height:1.68;max-width:62ch}
.scripture{font-family:var(--f-display);font-style:italic;font-size:1.12rem;line-height:1.6}
.ref{margin-top:6px;font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.quote{border-left:3px solid var(--k,var(--gold));padding-left:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:0;background:var(--k,var(--accent));color:#fff;font-weight:800;text-decoration:none;text-align:center}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:color-mix(in srgb,var(--k,var(--accent)) 15%,transparent);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.88rem}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.linkbtn{background:none;border:0;padding:0;color:var(--k,var(--accent));font-weight:800}
textarea,input[type=text],input[type=search],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
textarea{min-height:84px;resize:vertical}
label.lbl{display:block;font-weight:700;margin-bottom:6px}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1;min-width:0}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:10px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.82rem;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row-b{flex:1;min-width:0}
.row-t{font-weight:800}
.row-s{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{flex:none;width:18px;height:18px;color:var(--muted)}
.tick{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.tick.done{background:var(--k);border-color:var(--k)}
.tick svg{width:16px;height:16px}
.big-n{font-family:var(--f-display);font-size:3.6rem;font-weight:700;line-height:1;color:var(--k);font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.72rem;color:var(--muted);font-weight:700}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line)}
.dot.on{background:var(--c-mana);border-color:var(--c-mana);box-shadow:inset 0 0 0 5px color-mix(in srgb,#fff 45%,var(--c-mana))}
.dot.today{border-color:var(--ink);border-style:dashed}
.bars{display:grid;gap:10px}
.bar-l{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--k,var(--accent));border-radius:99px}
.lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.lesson.locked{opacity:.5}
.lesson.next{border-color:var(--c-fund);box-shadow:0 0 0 1px var(--c-fund)}
.ln{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--surface-2);font-variant-numeric:tabular-nums}
.lesson.done .ln{background:var(--c-fund);color:#fff}
.ln svg{width:18px;height:18px}
.lt{font-weight:800}
.ls{font-size:.85rem;color:var(--muted)}
.lock{width:18px;height:18px;color:var(--muted);flex:none;margin-left:auto}
.lesson .chev{margin-left:auto}
.wchips{display:flex;gap:8px;flex-wrap:wrap}
.wchip{display:inline-flex;align-items:baseline;gap:8px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left}
.wchip b{font-family:var(--f-display);font-size:1.1rem}
.heb{font-family:var(--f-heb)!important}
.stepbox{background:color-mix(in srgb,var(--k) 12%,var(--surface));border-radius:var(--r);padding:16px}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:5px;border-radius:99px;background:color-mix(in srgb,var(--k) 22%,transparent)}
.progress i.on{background:var(--k)}
.req{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.req:first-child{border-top:0}
.req-top{display:flex;gap:10px;justify-content:space-between}
.req-t{min-width:0;overflow-wrap:anywhere}
.answered{color:var(--gold);font-weight:700;font-size:.88rem}
.lvl{display:inline-flex;gap:3px}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.lvl i.on{background:var(--c-memoria)}
.recite{font-family:var(--f-display);font-size:1.35rem;line-height:1.75;min-height:7em}
.blank{display:inline-block;min-width:3ch;border-bottom:2px solid var(--c-memoria);color:transparent;cursor:pointer;line-height:1.2}
.blank.shown{color:var(--c-memoria);border-bottom-color:transparent}
.stones{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px}
.stone{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;text-align:center;min-width:0}
.st{width:100%;max-width:96px;aspect-ratio:1.15;display:grid;place-items:center;font-family:var(--f-display);font-size:1.5rem;font-weight:700;border:2px dashed var(--line);color:var(--line)}
.stone.on .st{background:linear-gradient(160deg,#F4E8C8,#C9B07A);border:0;color:#6B5320;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 6px 14px -8px rgba(80,60,20,.6)}
.stone-n{font-size:.8rem;font-weight:700;line-height:1.25}
.stone:not(.on) .stone-n{color:var(--muted)}
.dict{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.word{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.word-o{font-family:var(--f-display);font-size:1.4rem;line-height:1.3;overflow-wrap:anywhere}
.word-tr{font-weight:800;font-size:.9rem}
.word-m{font-size:.8rem;color:var(--muted)}
.word .star{position:absolute;right:10px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--c-fund)}
.big-orig{font-size:3.2rem;line-height:1.2;font-family:var(--f-display);overflow-wrap:anywhere}
.fruits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fr{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:var(--surface-2);text-align:center;font-weight:700;font-size:.84rem}
.fr i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD27A,#F08A3A 55%,#C8442A)}
.chain{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:center}
.chain div{flex:1;min-width:0}
.chain b{display:block;font-family:var(--f-display);font-size:1.8rem;color:var(--c-disc);font-variant-numeric:tabular-nums}
.chain span{font-size:.74rem;color:var(--muted);font-weight:700}
.chain em{flex:none;color:var(--muted);font-style:normal}
.dcard{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.dcard:first-child{border-top:0}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--c-disc);color:#fff;font-weight:800}
.code{width:100%;min-height:96px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.74rem;word-break:break-all}
.gospel{counter-reset:g;display:flex;flex-direction:column;gap:14px}
.gospel div{display:flex;gap:14px}
.gospel div::before{counter-increment:g;content:counter(g);flex:none;width:32px;height:32px;border-radius:50%;background:var(--c-roca);color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--f-display)}
.center{text-align:center}
.legal h3{font-family:var(--f-display);font-size:1.08rem;margin:16px 0 4px}.legal p{margin-top:6px;font-size:.95rem;line-height:1.6}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;line-height:1.45;background:var(--surface-2);padding:12px;border-radius:14px}
.consent input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--accent)}
/* Acabado más humano */
body{background:radial-gradient(1200px 600px at 100% -10%,color-mix(in srgb,var(--c-mana) 10%,transparent),transparent 60%),radial-gradient(900px 500px at -10% 30%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
svg.il{width:26px;height:26px;display:block}
.eyebrow{font-family:var(--f-display);font-style:italic;font-weight:500;text-transform:none;letter-spacing:0;font-size:.92rem;color:color-mix(in srgb,var(--k,var(--accent)) 70%,var(--muted))}
.hero .eyebrow{font-size:1rem}
.card{border:0;box-shadow:0 1px 0 rgba(30,50,30,.04),0 8px 24px -18px rgba(30,50,30,.35);border-radius:22px}
.xic{width:44px;height:44px;border-radius:46% 54% 52% 48%/55% 45% 55% 45%;background:color-mix(in srgb,var(--k) 15%,transparent)}
.xic svg.il{width:28px;height:28px}
.dring{border:0;background:color-mix(in srgb,var(--k) 14%,transparent);border-radius:48% 52% 45% 55%/52% 48% 52% 48%;width:46px;height:46px}
.dring svg.il{width:28px;height:28px}
.dring.done{background:var(--k)}
.explore{background:transparent;box-shadow:none;border:0;padding:6px 4px 0}
.explore .xrow{border-top:1px dashed color-mix(in srgb,var(--line) 90%,transparent)}
.daily h2,.group h2{font-size:1.25rem}
.daily-h .eyebrow{font-size:.95rem}
.nav button svg.il{width:27px;height:27px}
.nav button.on::before{left:38%;right:38%;height:4px;border-radius:0 0 6px 6px}
.lesson{border:0;box-shadow:0 6px 18px -14px rgba(30,50,30,.4);border-radius:20px}
.ln{border-radius:46% 54% 52% 48%/55% 45% 55% 45%}
.btn{border-radius:16px}

#toast .tgem{width:24px;height:22px;flex:none;border-radius:45% 55% 50% 50%/55% 45% 55% 45%;background:linear-gradient(160deg,#F4E8C8,#C9B07A)}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

@media (prefers-reduced-motion: no-preference){
  .fade{animation:fade .3s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .sway{transform-box:view-box;transform-origin:200px 330px;animation:sway 8s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.7deg)}}
  .flow{animation:flow 2.4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-48}}
  .glow{transform-box:fill-box;transform-origin:center;animation:glow 5s ease-in-out infinite}
  @keyframes glow{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
  .ring{transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
  @keyframes ring{from{transform:scale(1);opacity:1}to{transform:scale(2.8);opacity:0}}
  .cloud{animation:drift 60s linear infinite alternate}
  .grow .dr{stroke-dasharray:1;animation:draw 1.6s cubic-bezier(.4,0,.2,1) both}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.grow .lf{animation:lfin .7s ease both}
  @keyframes lfin{from{opacity:0}to{opacity:1}}
  .mote{animation:mote 16s linear infinite}
  @keyframes mote{0%{transform:translateY(0);opacity:0}15%{opacity:.6}85%{opacity:.5}100%{transform:translateY(-70px);opacity:0}}
  @keyframes drift{to{transform:translateX(40px)}}
  .twinkle{animation:tw 3s ease-in-out infinite}
  @keyframes tw{50%{opacity:.25}}
}
/* ===== V3: color por sección, cuadritos, iconos de línea ===== */
:root{--c-mana:#C99512;--c-palabra:#2F78BE;--c-oracion:#8E4FB3;--c-memoria:#2E9558;--c-fruto:#DB4F3C;--c-fund:#A0663A;--c-roca:#466E91;--c-piedras:#B07A2C;--c-disc:#14968A;--c-dicc:#3E55B8;--c-cree:#6B4FB8;--c-raz:#CF5B26;--c-med:#E2802A;--c-notas:#C2457A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-mana:#E8B53E;--c-palabra:#62A6E6;--c-oracion:#BB86DA;--c-memoria:#5FC484;--c-fruto:#F07D6B;--c-fund:#D29A6C;--c-roca:#7FA3C4;--c-piedras:#DCA85A;--c-disc:#4CC4B8;--c-dicc:#8A9BEA;--c-cree:#A891E6;--c-raz:#F08A58;--c-med:#F4A65E;--c-notas:#EB7FA9}}
:root[data-theme="dark"]{--c-mana:#E8B53E;--c-palabra:#62A6E6;--c-oracion:#BB86DA;--c-memoria:#5FC484;--c-fruto:#F07D6B;--c-fund:#D29A6C;--c-roca:#7FA3C4;--c-piedras:#DCA85A;--c-disc:#4CC4B8;--c-dicc:#8A9BEA;--c-cree:#A891E6;--c-raz:#F08A58;--c-med:#F4A65E;--c-notas:#EB7FA9}
svg.ic{display:block}
/* La hoja entera toma el color de la sección */
#sheet{background:linear-gradient(180deg,color-mix(in srgb,var(--sk,var(--accent)) 20%,var(--bg)) 0,color-mix(in srgb,var(--sk,var(--accent)) 11%,var(--bg)) 45%,color-mix(in srgb,var(--sk,var(--accent)) 7%,var(--bg)) 100%)}
#sheet .card{background:color-mix(in srgb,var(--sk,var(--accent)) 4%,var(--surface));box-shadow:0 1px 0 color-mix(in srgb,var(--sk,var(--accent)) 10%,transparent),0 10px 26px -20px color-mix(in srgb,var(--sk,var(--accent)) 60%,rgba(0,0,0,.4))}
#sheet .card h2{color:color-mix(in srgb,var(--sk,var(--accent)) 30%,var(--ink))}
#sheet .bar-top .back{color:color-mix(in srgb,var(--sk,var(--accent)) 60%,var(--ink))}
.hero{color:#fff;border:0;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--k) 70%,#fff) 0,transparent 55%),linear-gradient(155deg,var(--k) 0%,color-mix(in srgb,var(--k) 72%,#000) 100%);box-shadow:0 18px 40px -22px color-mix(in srgb,var(--k) 80%,#000)}
.hero::before{background:radial-gradient(60% 50% at 0% 100%,rgba(255,255,255,.12),transparent 70%)}
.hero h1,.hero .back,.hero-v{color:#fff}
.hero .eyebrow{color:rgba(255,255,255,.86)}
.hero-ref{color:rgba(255,255,255,.75)}
.hero .expl summary{color:#fff}
.hero-art{right:16px;top:16px;width:58px;height:58px;border-radius:18px;opacity:1;background:rgba(255,255,255,.18);display:grid;place-items:center;filter:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.hero-art svg{width:30px;height:30px}
.hero-art svg *{fill:none!important;stroke:#fff!important}
.hero h1{max-width:calc(100% - 70px)}
/* Cuadritos de hoy */
.today-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:18px 2px 10px}
.today-h h2{font-size:1.2rem;margin-top:2px}
.tiles4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:124px;padding:14px;border:0;border-radius:22px;text-align:left;color:#fff;overflow:hidden;
 background:radial-gradient(120% 80% at 100% 0%,color-mix(in srgb,var(--k) 65%,#fff) 0,transparent 60%),linear-gradient(160deg,var(--k),color-mix(in srgb,var(--k) 70%,#000));box-shadow:0 12px 26px -18px color-mix(in srgb,var(--k) 85%,#000)}
.tile .t-ic{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.2);display:grid;place-items:center;margin-bottom:auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.tile .t-ic svg{width:22px;height:22px;stroke:#fff}
.tile b{font-size:1rem;margin-top:12px;line-height:1.2}
.tile>span:last-of-type{font-size:.8rem;opacity:.88;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .t-ok{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--k);display:grid;place-items:center}
.tile .t-ok svg{width:16px;height:16px}
.tile.done{filter:saturate(.75)}
.tile:active{transform:scale(.98)}
/* Cuadritos de exploración */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:560px){.tgrid{grid-template-columns:repeat(3,1fr)}}
.gtile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px;min-height:112px;border:0;border-radius:20px;text-align:left;background:color-mix(in srgb,var(--k) 9%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--k) 16%,transparent)}
.gtile .g-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(160deg,var(--k),color-mix(in srgb,var(--k) 75%,#000));margin-bottom:auto;box-shadow:0 6px 14px -8px var(--k)}
.gtile .g-ic svg{width:20px;height:20px;stroke:#fff}
.gtile b{font-size:.95rem;margin-top:10px;line-height:1.2;color:var(--ink)}
.gtile span:last-child{font-size:.78rem;color:var(--muted);line-height:1.3}
.gtile:active{transform:scale(.98)}
.sect-t{margin:22px 2px 10px;font-family:var(--f-display);font-size:1.15rem;font-weight:600}
.explore{padding:0;margin-top:6px}
.masHead{margin:8px 2px 4px}
/* Plan */
.pickplan{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:12px;border:0;border-radius:16px;text-align:left;background:color-mix(in srgb,var(--k) 9%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--k) 18%,transparent)}
.pp-n{flex:none;width:52px;height:52px;border-radius:14px;background:var(--k);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.25rem;line-height:1;text-align:center}
.pp-n small{display:block;font-family:var(--f-body,inherit);font-size:.6rem;font-weight:700;opacity:.85}
.pp-go{flex:none;font-weight:800;font-size:.85rem;color:var(--k)}
.homeplan{margin-top:12px}
/* Cabecera */
.top .acts{display:flex;gap:4px}
/* Guía */
#tour{position:fixed;inset:0;z-index:80}
#tour .spot{position:absolute;border-radius:22px;box-shadow:0 0 0 9999px rgba(8,18,10,.62);transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#tour .spot.none{left:50%!important;top:50%!important;width:0!important;height:0!important}
#tour .tcard{position:absolute;left:50%;transform:translateX(-50%);width:min(92vw,400px);background:var(--surface);color:var(--ink);border-radius:24px;padding:20px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
#tour .tcard h3{font-family:var(--f-display);font-size:1.3rem;margin-top:8px}
#tour .tcard p{margin-top:6px;font-size:.95rem;line-height:1.5;color:var(--muted)}
#tour .tdots{display:flex;gap:6px}
#tour .tdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
#tour .tdots i.on{background:var(--accent);width:18px;border-radius:4px}
#tour .trow{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
#tour .tic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--k,var(--accent))}
#tour .tic svg{width:24px;height:24px;stroke:#fff}
/* Predicaciones */
.note-i{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 0;border-top:1px solid var(--line)}
.note-i:first-of-type{border-top:0}
.note-i b{display:block;font-size:1rem}
.note-i span{font-size:.82rem;color:var(--muted)}
.nf{margin-top:12px}
.nf input,.nf textarea{width:100%}
.nf textarea{min-height:110px}
.saved{font-size:.78rem;color:var(--muted);min-height:1em}
/* Sesión guiada */
.sess{display:block;width:100%;text-align:left;border:0;margin:6px 0 14px;padding:18px;border-radius:26px;color:#fff;background:radial-gradient(110% 90% at 100% 0%,color-mix(in srgb,var(--accent) 55%,#fff) 0,transparent 55%),linear-gradient(155deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#000));box-shadow:0 18px 40px -22px color-mix(in srgb,var(--accent) 80%,#000)}

const KEY='arraigados.v1';
let memCopy=null;
function fresh(){return {v:2,uid:'',path:'',version:'RVR1960',vtext:{},mentor:'',disciples:[],name:'',started:null,days:{},lessons:{},notes:{},readIdx:0,readLog:[],verses:{},prayers:[],prayed:0,stones:{}};}
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(fresh(),JSON.parse(r));}catch(e){}return memCopy||fresh();}
function save(){memCopy=S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();

const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>keyOf(new Date());
function addDays(k,n){const[y,m,d]=k.split('-').map(Number);return keyOf(new Date(y,m-1,d+n));}
function fmtDate(k,opt){const[y,m,d]=k.split('-').map(Number);return new Intl.DateTimeFormat('es-ES',opt||{day:'numeric',month:'short'}).format(new Date(y,m-1,d));}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function active(k){const d=S.days[k];return !!(d&&(d.read||d.pray||d.mem||d.lesson||d.med));}
const totalActive=()=>Object.keys(S.days).filter(active).length;
const lessonsDone=()=>LESSONS.filter(l=>S.lessons[l.id]).length;
const learned=()=>Object.values(S.verses).filter(v=>v.lvl>=3).length;
const dueVerses=()=>Object.keys(S.verses).filter(id=>S.verses[id].due<=today());
const unlockedWords=()=>new Set(ALL_LESSONS.filter(l=>S.lessons[l.id]).flatMap(l=>l.words));

/* Racha con gracia: un día sin maná por cada 7 no rompe la racha */
function streakInfo(){
  if(!S.started)return{n:0,grace:false,todayDone:false};
  let k=today();const todayDone=active(k);if(!todayDone)k=addDays(k,-1);
  let n=0,prev=-99,i=0;
  while(i<4000){
    if(k<S.started)break;
    if(active(k))n++;
    else{if(n===0||i-prev<7)break;prev=i;}
    i++;k=addDays(k,-1);
  }
  return{n,grace:prev>=0&&prev<7,todayDone};
}
function stageIdx(){
  const L=lessonsDone(),V=learned(),A=totalActive();
  let s=0;for(let i=1;i<STAGES.length;i++){const r=STAGES[i].req;if(L>=r.L&&V>=r.V&&A>=r.A)s=i;}
  return s;
}

function markDay(kind){
  const t=today(),y=addDays(t,-1);
  const was=active(t);
  const before=Object.keys(S.days).some(k=>k<t&&active(k));
  S.days[t]=S.days[t]||{};S.days[t][kind]=true;
  if(!S.started)S.started=t;
  if(!was&&before&&!active(y))grant('ebenezer');
  save();checkStones();
}
let toastQ=[];
function grant(id){if(S.stones[id])return;S.stones[id]=today();save();toastQ.push(id);runToast();}
function checkStones(){STONES.forEach(s=>{if(!S.stones[s.id]&&s.test())grant(s.id);});}
let toastBusy=false;
function runToast(){
  if(toastBusy||!toastQ.length)return;toastBusy=true;
  const id=toastQ.shift(),st=STONES.find(s=>s.id===id),el=document.getElementById('toast');
  el.innerHTML='<span class="tgem"></span><span>Nuevo recuerdo de fe: '+esc(st.n)+'</span>';
  el.hidden=false;
  setTimeout(()=>{el.hidden=true;toastBusy=false;runToast();},3200);
}

function archIn(t){const out=[];Object.keys(ARCH).forEach(w=>{try{if(new RegExp('(?<![\\p{L}])'+w.replace(/[-]/g,'\\-')+'(?![\\p{L}])','iu').test(t))out.push(w);}catch(e){if(t.toLowerCase().includes(w.toLowerCase()))out.push(w);}});return out;}
function explain(ref,t,dark){
  const e=EXPL[ref],ws=archIn(t||'');if(!e&&!ws.length)return '';
  return '<details class="expl'+(dark?' dark':'')+'"><summary>En palabras de hoy</summary>'+(e?'<p class="expl-t">'+esc(e)+'</p>':'')+(ws.length?'<div class="arch">'+ws.map(w=>'<span><b>'+esc(w)+'</b> '+esc(ARCH[w])+'</span>').join('')+'</div>':'')+'<p class="expl-n">Explicación, no traducción.</p></details>';
}

function curPlan(){if(S.plan&&!S.planChosen){if((((S.plans||{})[S.plan])||{}).i>0)S.planChosen=1;else S.plan='';}return S.plan?PLANES.find(p=>p.id===S.plan)||null:null;}

function migratePlans(){
  if(!S.plans)S.plans={};

}

const LESSONS2=[
 {id:'c-permanecer',t:'Permanecer en la vid',s:'La fuente del fruto',ref:'Juan 15:5',v:'gal2-20',words:['meno'],
  body:['La vida cristiana no es esforzarte por dar fruto, sino permanecer unido a Cristo. La rama no se estira para producir uvas: está unida a la vid y la savia hace el resto.',
   'Permanecer (ménō) es quedarse, habitar, no irse. Se permanece en su Palabra (Juan 15:7), en su amor (15:9) y obedeciendo lo que dice (15:10).',
   'Separados de Él no podemos hacer nada que tenga valor eterno. Unidos a Él, el fruto llega a su tiempo.'],
  q:['¿En qué estás intentando dar fruto con tus propias fuerzas?','¿Qué te ayuda a «quedarte» cerca de Jesús durante el día?'],
  paso:'Lee Juan 15:1-11 despacio y subraya cada vez que aparece «permanecer».'},
 {id:'c-mente',t:'Una mente renovada',s:'Pensar como Cristo',ref:'Romanos 12:2',v:'ro12-2',words:['metamorphoo','nous'],
  body:['El mundo tiene un molde y nos empuja a encajar en él. Pablo dice: no os amoldéis; dejaos transformar.',
   'La palabra es metamorphóō, la misma de la transfiguración de Jesús (Mateo 17:2). Es un cambio desde dentro, y empieza por la mente (noûs): lo que crees, lo que valoras, lo que piensas.',
   'La mente se renueva llenándola de la Palabra, poniendo los pensamientos bajo Cristo (2 Corintios 10:5) y pensando en lo verdadero, honesto y justo (Filipenses 4:8).'],
  q:['¿Qué ideas del mundo que te rodea has aceptado sin darte cuenta?','¿Qué alimenta tu mente cada día?'],
  paso:'Elige una mentira que sueles creer y escribe al lado el versículo que la desmiente.'},
 {id:'c-espiritu',t:'Andar en el Espíritu',s:'La lucha interior',ref:'Gálatas 5:16',v:'gal5-16',words:['sarx'],
  body:['Todo creyente vive una lucha: la carne (sárx), la inclinación a vivir sin Dios, contra el Espíritu Santo que vive en nosotros (Gálatas 5:17).',
   'La solución no es solo apretar los dientes, sino andar en el Espíritu: depender de Él paso a paso, como quien camina al ritmo de otro.',
   'Gálatas 5 pone dos listas una junto a otra: las obras de la carne y el fruto del Espíritu. La pregunta de cada día es a cuál de las dos estoy alimentando.'],
  q:['¿Qué obras de la carne ves más presentes en ti (Gálatas 5:19-21)?','¿Qué significaría hoy «caminar al paso» del Espíritu?'],
  paso:'Empieza el día con esta oración: «Espíritu Santo, guíame hoy paso a paso».'},
 {id:'c-tentacion',t:'Vencer la tentación',s:'Dios da la salida',ref:'1 Corintios 10:13',v:'1co10-13',words:['peirasmos'],
  body:['La tentación no es pecado; ceder a ella sí. Jesús mismo fue tentado en todo, pero sin pecado (Hebreos 4:15).',
   'Peirasmós significa a la vez prueba y tentación. La misma situación puede hacerte caer o hacerte más fuerte. Dios promete que no te dejará ser tentado más allá de tus fuerzas y que siempre habrá una salida.',
   'Jesús venció en el desierto con la Palabra (Mateo 4). Huye de lo que te arrastra (2 Timoteo 2:22), ten a alguien con quien rendir cuentas y no te quedes a solas con la tentación.'],
  q:['¿Cuáles son tus momentos y lugares de mayor tentación?','¿Cuál suele ser la «salida» que Dios te ofrece y no tomas?'],
  paso:'Memoriza 1 Corintios 10:13 y compártele a alguien de confianza una tentación concreta para que ore contigo.'},
 {id:'c-perdon',t:'Perdonar',s:'Como fuimos perdonados',ref:'Mateo 18:21-22',vt:'Entonces Pedro, llegándose a él, dijo: Señor, ¿cuántas veces perdonaré a mi hermano que pecare contra mí? ¿hasta siete? Jesús le dice: No te digo hasta siete, mas aun hasta setenta veces siete.',v:'ef4-32',words:['aphesis'],
  body:['Pedro creía ser generoso al ofrecer siete veces. Jesús responde: setenta veces siete. No es una cifra para contar, sino una forma de vida.',
   'Perdón (áphesis) significa soltar, liberar. Perdonar no es decir que el daño no importó, ni volver a confiar de inmediato: es soltar la deuda y dejar la justicia en manos de Dios (Romanos 12:19).',
   'Perdonamos porque hemos sido perdonados de una deuda mucho mayor (Mateo 18:23-35). El rencor encadena al que lo guarda.'],
  q:['¿A quién te está costando perdonar?','¿Qué deuda tuya canceló Dios en Cristo?'],
  paso:'Escribe el nombre de alguien a quien necesitas perdonar y ora por esa persona, bendiciéndola (Lucas 6:28).'},
 {id:'c-humildad',t:'Humildad',s:'El camino de Jesús',ref:'Filipenses 2:3',v:'fil2-3',words:['tapeinophrosyne'],
  body:['La humildad no es pensar mal de ti, sino pensar menos en ti. Pablo pide considerar a los demás como más importantes.',
   'El modelo es Jesús: siendo Dios, se hizo siervo y obedeció hasta la cruz (Filipenses 2:5-8). La palabra tapeinophrosýnē era, para los griegos, casi un defecto; el evangelio la convirtió en virtud.',
   'Dios resiste a los soberbios y da gracia a los humildes (Santiago 4:6). La humildad abre la puerta a su gracia.'],
  q:['¿Dónde se nota más tu orgullo: en hablar, en compararte, en no pedir ayuda?','¿A quién puedes servir esta semana sin que se sepa?'],
  paso:'Haz hoy un servicio escondido a alguien de tu casa o de tu iglesia.'},
 {id:'c-lengua',t:'Pronto para oír',s:'Las palabras',ref:'Santiago 1:19',v:'stg1-19',words:['rhema'],
  body:['Santiago da tres consejos sencillos: rápido para escuchar, lento para hablar, lento para enfadarte. Si los vivimos, cambian nuestras relaciones.',
   'La lengua es pequeña pero poderosa: puede bendecir o destruir (Santiago 3:5-10). De la abundancia del corazón habla la boca (Lucas 6:45).',
   'Dios quiere que nuestras palabras edifiquen y den gracia a quien escucha (Efesios 4:29).'],
  q:['¿Escuchas para entender o para responder?','¿Qué palabra tuya necesita una disculpa?'],
  paso:'Durante un día, antes de responder, haz una pausa y pregunta: ¿esto edifica?'},
 {id:'c-prueba',t:'Firmes en la prueba',s:'El sufrimiento que madura',ref:'Santiago 1:2-4',vt:'Hermanos míos, tened por sumo gozo cuando cayereis en diversas tentaciones; Sabiendo que la prueba de vuestra fe obra paciencia. Mas tenga la paciencia perfecta su obra, para que seáis perfectos y cabales, sin faltar en alguna cosa.',v:'ro8-28',words:['hypomone','teleios'],
  body:['Santiago no dice que la prueba sea buena en sí, sino que puede producir algo bueno: paciencia, constancia (hypomonḗ) y madurez (téleios).',
   'Dios no desperdicia el dolor de sus hijos. Él hace que todas las cosas ayuden a bien a los que le aman (Romanos 8:28), aunque no entendamos el porqué.',
   'En la prueba, sé sincero con Dios como en los Salmos, apóyate en tus hermanos y recuerda que es temporal comparado con la gloria que viene (2 Corintios 4:17).'],
  q:['¿Qué prueba estás atravesando ahora?','¿Qué ha hecho Dios en ti en pruebas anteriores?'],
  paso:'Escribe en tu diario una prueba pasada y lo que Dios hizo en ella. Será como una piedra de memorial: un recuerdo de lo que Dios hizo.'},
 {id:'c-dones',t:'Servir con tus dones',s:'Todos tienen un lugar',ref:'1 Pedro 4:10',v:'1pe4-10',words:['charisma','diakonia'],
  body:['Cada creyente ha recibido al menos un don (chárisma), un regalo de gracia. No es para lucirse, sino para servir.',
   'Hay dones de palabra y dones de servicio (1 Pedro 4:11), y todos son necesarios, como los miembros de un cuerpo (1 Corintios 12).',
   'Descubres tus dones sirviendo: probando, escuchando lo que otros ven en ti y notando dónde Dios bendice tu servicio.'],
  q:['¿Qué te han dicho otros que haces bien para bendecirles?','¿Dónde podrías servir en tu iglesia este mes?'],
  paso:'Pregunta a tu pastor o mentor dónde se necesita ayuda y ofrécete para un servicio concreto.'},
 {id:'c-dar',t:'Dar con alegría',s:'La generosidad',ref:'2 Corintios 9:7',v:'2co9-7',words:['hilaros'],
  body:['Dios no necesita nuestro dinero, pero quiere nuestro corazón; y donde está nuestro tesoro, allí está el corazón (Mateo 6:21).',
   'Dios ama al dador alegre (hilarós, de donde viene «hilarante»). Dar no es una obligación triste, sino una respuesta feliz a lo mucho que hemos recibido.',
   'La generosidad incluye dinero, tiempo, casa y atención. Damos con planificación («como propuso en su corazón»), con libertad y confiando en que Dios provee.'],
  q:['¿Qué revela tu forma de gastar sobre lo que amas?','¿A quién podrías bendecir esta semana con lo que tienes?'],
  paso:'Decide en oración una forma concreta y planificada de dar este mes.'},
 {id:'c-testigo',t:'No me avergüenzo',s:'Compartir tu fe',ref:'Romanos 1:16',v:'ro1-16',words:['martys','homologeo'],
  body:['El evangelio no es un consejo más: es el poder de Dios para salvar. Por eso Pablo no se avergonzaba de él.',
   'Un testigo (mártys) cuenta lo que ha visto. No necesitas ser experto: cuenta tu historia (cómo eras, cómo conociste a Cristo, qué ha cambiado) y la buena noticia de Jesús.',
   'Confesar (homologéō) es decir lo mismo que Dios dice. Ora por las personas, ama sin condiciones y habla cuando haya ocasión, con mansedumbre y respeto (1 Pedro 3:15).'],
  q:['¿Quiénes son las tres personas cercanas que más necesitan a Cristo?','¿Podrías contar tu testimonio en dos minutos?'],
  paso:'Escribe tu testimonio en tres partes y ora cada día por tres personas por su nombre.'},
 {id:'c-madurez',t:'Hacia la madurez',s:'Dios termina lo que empieza',ref:'Filipenses 1:6',v:'fil1-6',words:['teleios'],
  body:['La madurez cristiana (teléios: completo, adulto) no es saberlo todo ni no fallar nunca. Es parecerse cada vez más a Cristo (Efesios 4:13).',
   'El crecimiento es obra de Dios: Él empezó la buena obra y la terminará. Nuestra parte es permanecer, obedecer y no rendirnos (Filipenses 2:12-13).',
   'Un creyente maduro se reconoce por su amor, su firmeza en la verdad y porque ayuda a otros a crecer. Por eso la madurez termina en discipulado.'],
  q:['¿En qué has crecido desde que conociste a Cristo?','¿En qué área quieres pedirle a Dios que te haga madurar este año?'],
  paso:'Revisa tu diario y da gracias por tres cosas en las que Dios te ha hecho crecer.'}

 elohim:{o:'אֱלֹהִים',tr:'Elohim',lang:'Hebreo',c:'Dios',heb:1,m:'Dios: el Poderoso',d:'Es plural en la forma, pero va con verbos en singular. Habla de la grandeza y plenitud de Dios. Es la primera palabra para Dios en la Biblia.',ref:'Génesis 1:1'},
 adonai:{o:'אֲדֹנָי',tr:'Adonai',lang:'Hebreo',c:'Dios',heb:1,m:'Señor, dueño',d:'Expresa que Dios es Señor y dueño de todo. Los judíos lo leían en lugar del nombre YHWH por reverencia.',ref:'Salmo 8:1'},
 shaddai:{o:'אֵל שַׁדַּי',tr:'El Shaddai',lang:'Hebreo',c:'Dios',heb:1,m:'Dios Todopoderoso',d:'El nombre con el que Dios se presentó a Abraham al confirmar su pacto: nada es imposible para Él.',ref:'Génesis 17:1'},
 yireh:{o:'יְהוָה יִרְאֶה',tr:'YHWH Yiré',lang:'Hebreo',c:'Dios',heb:1,m:'El SEÑOR proveerá',d:'Abraham llamó así al monte donde Dios proveyó el cordero en lugar de Isaac. Apunta al Cordero que Dios daría en el Calvario.',ref:'Génesis 22:14'},
 rafa:{o:'יְהוָה רֹפְאֶךָ',tr:'YHWH Rofeja',lang:'Hebreo',c:'Dios',heb:1,m:'El SEÑOR que te sana',d:'Dios se reveló así a Israel en el desierto, tras endulzar las aguas amargas de Mara.',ref:'Éxodo 15:26'},
 emet:{o:'אֱמֶת',tr:'emet',lang:'Hebreo',c:'Dios',heb:1,m:'Verdad, fidelidad',d:'Algo firme en lo que te puedes apoyar. La Palabra de Dios es verdad en su totalidad.',ref:'Salmo 119:160'},
 tov:{o:'טוֹב',tr:'tov',lang:'Hebreo',c:'Dios',heb:1,m:'Bueno',d:'Dios miró todo lo que había creado y era bueno en gran manera. También es lo que Él es: el SEÑOR es bueno.',ref:'Génesis 1:31'},
 berit:{o:'בְּרִית',tr:'berit',lang:'Hebreo',c:'Salvación',heb:1,m:'Pacto, alianza',d:'Un compromiso solemne que une a dos partes. Toda la Biblia es la historia de los pactos de Dios, hasta el nuevo pacto en la sangre de Cristo.',ref:'Jeremías 31:31'},
 jen:{o:'חֵן',tr:'jen',lang:'Hebreo',c:'Salvación',heb:1,m:'Gracia, favor',d:'Noé halló gracia ante los ojos de Dios. Es el favor que se recibe sin merecerlo, como en el griego járis.',ref:'Génesis 6:8'},
 rajamim:{o:'רַחֲמִים',tr:'rajamim',lang:'Hebreo',c:'Dios',heb:1,m:'Compasión, misericordias',d:'Viene de la misma raíz que «vientre materno»: la compasión de una madre por su hijo. Así son las misericordias de Dios.',ref:'Lamentaciones 3:22'},
 tsedaka:{o:'צְדָקָה',tr:'tsedaká',lang:'Hebreo',c:'Salvación',heb:1,m:'Justicia',d:'Vivir en la relación correcta con Dios y con los demás. Abraham creyó a Dios, y le fue contado por justicia.',ref:'Génesis 15:6'},
 kafar:{o:'כָּפַר',tr:'kafar',lang:'Hebreo',c:'Salvación',heb:1,m:'Expiar, cubrir',d:'La raíz de Yom Kipur, el día de la expiación. La sangre del sacrificio cubría el pecado; Cristo lo quita para siempre.',ref:'Levítico 16:30'},
 jata:{o:'חָטָא',tr:'jatá',lang:'Hebreo',c:'Salvación',heb:1,m:'Pecar: errar el blanco',d:'En Jueces 20:16 describe a honderos que no erraban. Pecar es no dar en el blanco de la voluntad de Dios.',ref:'Jueces 20:16'},
 pesha:{o:'פֶּשַׁע',tr:'pésha',lang:'Hebreo',c:'Salvación',heb:1,m:'Rebelión, transgresión',d:'El pecado como rebeldía consciente contra Dios. Bienaventurado aquel cuya transgresión ha sido perdonada.',ref:'Salmo 32:1'},
 avon:{o:'עָוֹן',tr:'avón',lang:'Hebreo',c:'Salvación',heb:1,m:'Iniquidad: lo torcido',d:'El pecado como algo torcido por dentro, y también la culpa que deja. Dios carga nuestra iniquidad sobre el Siervo (Isaías 53:6).',ref:'Salmo 32:5'},
 mishpat:{o:'מִשְׁפָּט',tr:'mishpat',lang:'Hebreo',c:'Vida cristiana',heb:1,m:'Justicia, juicio recto',d:'Tratar a las personas con justicia, especialmente a los débiles. Es parte de lo que Dios pide: hacer justicia, amar misericordia y humillarte ante Él.',ref:'Miqueas 6:8'},
 jojma:{o:'חָכְמָה',tr:'jojmá',lang:'Hebreo',c:'Vida cristiana',heb:1,m:'Sabiduría',d:'No es solo conocimiento, sino saber vivir bien delante de Dios. Empieza con el temor del SEÑOR.',ref:'Proverbios 9:10'},
 yira:{o:'יִרְאָה',tr:'yirá',lang:'Hebreo',c:'Vida cristiana',heb:1,m:'Temor reverente',d:'No es terror, sino asombro y respeto profundo ante la grandeza de Dios, que lleva a obedecerle.',ref:'Proverbios 1:7'},
 ahava:{o:'אַהֲבָה',tr:'ahavá',lang:'Hebreo',c:'Vida cristiana',heb:1,m:'Amor',d:'Amar a Dios con todo el corazón, el alma y las fuerzas es el centro de la fe de Israel.',ref:'Deuteronomio 6:5'},
 shema:{o:'שְׁמַע',tr:'shemá',lang:'Hebreo',c:'Oración y adoración',heb:1,m:'¡Escucha! (y obedece)',d:'En hebreo, escuchar de verdad es obedecer. Así empieza la confesión de fe de Israel: Escucha, Israel, el SEÑOR uno es.',ref:'Deuteronomio 6:4'},
 tehila:{o:'תְּהִלָּה',tr:'tehilá',lang:'Hebreo',c:'Oración y adoración',heb:1,m:'Alabanza',d:'El libro de los Salmos se llama en hebreo Tehilim, «alabanzas». Su alabanza estará de continuo en mi boca.',ref:'Salmo 34:1'},
 toda:{o:'תּוֹדָה',tr:'todá',lang:'Hebreo',c:'Oración y adoración',heb:1,m:'Acción de gracias',d:'Reconocer en voz alta lo que Dios ha hecho. Entrad por sus puertas con acción de gracias.',ref:'Salmo 100:4'},
 barak:{o:'בָּרַךְ',tr:'barak',lang:'Hebreo',c:'Oración y adoración',heb:1,m:'Bendecir',d:'Relacionado con «rodilla»: bendecir a Dios es adorarle rendido. Y que Dios te bendiga es que te dé su favor y su vida.',ref:'Números 6:24'},
 qava:{o:'קָוָה',tr:'qavá',lang:'Hebreo',c:'Vida cristiana',heb:1,m:'Esperar: estar tensado hacia',d:'Su raíz evoca una cuerda trenzada y tensa. Esperar en Dios no es quedarse quieto, sino estar atado a Él con expectación.',ref:'Isaías 40:31'},
 shabat:{o:'שַׁבָּת',tr:'shabat',lang:'Hebreo',c:'Vida cristiana',heb:1,m:'Reposo',d:'Cesar del trabajo para descansar en Dios. Por eso tu racha de maná tiene un día de gracia: el descanso también es de Dios.',ref:'Éxodo 20:8'},
 pesaj:{o:'פֶּסַח',tr:'pésaj',lang:'Hebreo',c:'Salvación',heb:1,m:'Pascua: pasar por encima',d:'La noche en que el juicio pasó por encima de las casas marcadas con la sangre del cordero. Cristo es nuestra Pascua (1 Corintios 5:7).',ref:'Éxodo 12:13'},
 navi:{o:'נָבִיא',tr:'naví',lang:'Hebreo',c:'Iglesia y misión',heb:1,m:'Profeta: el que habla de parte de Dios',d:'El profeta no adivinaba el futuro por curiosidad: llamaba al pueblo a volver a Dios. Moisés anunció a un Profeta mayor, cumplido en Jesús.',ref:'Deuteronomio 18:15'},
 tsur:{o:'צוּר',tr:'tsur',lang:'Hebreo',c:'Dios',heb:1,m:'Roca',d:'Imagen de Dios como refugio firme e inmovible. Por eso el árbol de esta app tiene sus raíces abrazadas a la Roca.',ref:'Salmo 18:2'},
 roe:{o:'רֹעֶה',tr:'roé',lang:'Hebreo',c:'Dios',heb:1,m:'Pastor',d:'El que guía, alimenta y protege a las ovejas. Jesús se presenta como el buen Pastor que da su vida (Juan 10:11).',ref:'Salmo 23:1'},
 adam:{o:'אָדָם',tr:'adam',lang:'Hebreo',c:'Dios',heb:1,m:'Ser humano, de la tierra',d:'Está emparentado con adamá, «tierra». Dios formó al ser humano del polvo y le dio aliento de vida.',ref:'Génesis 2:7'},
 ebenezer:{o:'אֶבֶן הָעֵזֶר',tr:'Eben-ezer',lang:'Hebreo',c:'Vida cristiana',heb:1,m:'Piedra de ayuda',d:'Samuel levantó una piedra para recordar que hasta allí les había ayudado Dios. Por eso esta app tiene piedras de memorial.',ref:'1 Samuel 7:12'},
 man:{o:'מָן',tr:'man',lang:'Hebreo',c:'Dios',heb:1,m:'Maná: «¿qué es esto?»',d:'Cuando los israelitas vieron el pan del cielo preguntaron «¿qué es esto?», y así se quedó su nombre. Jesús es el verdadero pan del cielo (Juan 6:35).',ref:'Éxodo 16:15'},
 hosanna:{o:'הוֹשִׁיעָה נָּא',tr:'hoshía na (hosanna)',lang:'Hebreo',c:'Oración y adoración',heb:1,m:'¡Salva ahora!',d:'Un grito de oración del Salmo 118 que se convirtió en aclamación. Así recibieron a Jesús al entrar en Jerusalén.',ref:'Salmo 118:25'},
 theos:{o:'θεός',tr:'theós',lang:'Griego',c:'Dios',m:'Dios',d:'La palabra común para Dios en el Nuevo Testamento. Juan 1:1 la aplica al Verbo: el Verbo era Dios.',ref:'Juan 1:1'},
 pater:{o:'πατήρ',tr:'patḗr',lang:'Griego',c:'Dios',m:'Padre',d:'Jesús enseñó a sus discípulos a llamar a Dios «Padre nuestro». Es la gran revelación del evangelio: Dios es Padre.',ref:'Mateo 6:9'},
 huios:{o:'υἱός',tr:'huiós',lang:'Griego',c:'Dios',m:'Hijo',d:'Jesús es el Hijo de Dios en un sentido único, y por Él somos adoptados como hijos.',ref:'Gálatas 4:4-6'},
 pneuma:{o:'πνεῦμα',tr:'pneûma',lang:'Griego',c:'Dios',m:'Espíritu, viento, aliento',d:'Como el hebreo rúaj, significa también viento. El viento sopla donde quiere: así es todo el que nace del Espíritu.',ref:'Juan 3:8'},
 aletheia:{o:'ἀλήθεια',tr:'alḗtheia',lang:'Griego',c:'Dios',m:'Verdad: lo que no está oculto',d:'Literalmente «lo que no está escondido». Jesús no solo dice la verdad: Él es la verdad.',ref:'Juan 14:6'},
 eirene:{o:'εἰρήνη',tr:'eirḗnē',lang:'Griego',c:'Carácter',m:'Paz',d:'Recoge el sentido del hebreo shalom. Es paz con Dios (Romanos 5:1) y la paz de Dios que guarda el corazón (Filipenses 4:7).',ref:'Juan 14:27'},
 chara:{o:'χαρά',tr:'chará',lang:'Griego',c:'Carácter',m:'Gozo',d:'Un gozo que no depende de las circunstancias, porque nace de Dios. Pablo lo escribió desde la cárcel.',ref:'Filipenses 4:4'},
 eleos:{o:'ἔλεος',tr:'éleos',lang:'Griego',c:'Dios',m:'Misericordia',d:'Compasión que actúa. De aquí viene «Kyrie eleison»: Señor, ten piedad.',ref:'Efesios 2:4'},
 makrothymia:{o:'μακροθυμία',tr:'makrothymía',lang:'Griego',c:'Carácter',m:'Paciencia: tardar en enojarse',d:'Literalmente «ánimo largo»: tener una mecha larga. Es la paciencia con las personas, fruto del Espíritu.',ref:'Gálatas 5:22'},
 chrestotes:{o:'χρηστότης',tr:'chrēstótēs',lang:'Griego',c:'Carácter',m:'Benignidad, amabilidad',d:'Una bondad dulce y útil para los demás. La benignidad de Dios nos guía al arrepentimiento (Romanos 2:4).',ref:'Gálatas 5:22'},
 agathosyne:{o:'ἀγαθωσύνη',tr:'agathōsýnē',lang:'Griego',c:'Carácter',m:'Bondad',d:'La bondad activa que hace el bien, a veces con firmeza. Fruto del Espíritu.',ref:'Gálatas 5:22'},
 enkrateia:{o:'ἐγκράτεια',tr:'enkráteia',lang:'Griego',c:'Carácter',m:'Dominio propio',d:'Tener el control de uno mismo por dentro. La RV1909 lo traduce «templanza».',ref:'Gálatas 5:23'},
 tapeinophrosyne:{o:'ταπεινοφροσύνη',tr:'tapeinophrosýnē',lang:'Griego',c:'Carácter',m:'Humildad',d:'Para los griegos era casi un defecto. Jesús la convirtió en virtud al hacerse siervo de todos.',ref:'Filipenses 2:3'},
 dynamis:{o:'δύναμις',tr:'dýnamis',lang:'Griego',c:'Dios',m:'Poder',d:'El poder de Dios que actúa. El evangelio es dýnamis de Dios para salvación. (No viene de «dinamita»: es al revés.)',ref:'Romanos 1:16'},
 exousia:{o:'ἐξουσία',tr:'exousía',lang:'Griego',c:'Dios',m:'Autoridad',d:'El derecho a mandar. Toda autoridad le ha sido dada a Jesús, y desde ahí nos envía.',ref:'Mateo 28:18'},
 kerysso:{o:'κηρύσσω',tr:'kērýssō',lang:'Griego',c:'Iglesia y misión',m:'Proclamar, anunciar',d:'Lo que hacía el heraldo del rey en la plaza. Predicar es anunciar públicamente lo que Dios ha hecho en Cristo.',ref:'Romanos 10:14'},
 didache:{o:'διδαχή',tr:'didachḗ',lang:'Griego',c:'Iglesia y misión',m:'Enseñanza, doctrina',d:'La iglesia primitiva perseveraba en la didachḗ de los apóstoles. La sana doctrina alimenta y protege.',ref:'Hechos 2:42'},
 proskyneo:{o:'προσκυνέω',tr:'proskynéō',lang:'Griego',c:'Oración y adoración',m:'Adorar: postrarse',d:'Inclinarse ante alguien en reverencia. Los que adoran a Dios deben hacerlo en espíritu y en verdad.',ref:'Juan 4:24'},
 latreia:{o:'λατρεία',tr:'latreía',lang:'Griego',c:'Oración y adoración',m:'Culto, servicio a Dios',d:'Pablo llama «culto racional» a entregar toda la vida a Dios, no solo una hora a la semana.',ref:'Romanos 12:1'},
 doulos:{o:'δοῦλος',tr:'doûlos',lang:'Griego',c:'Iglesia y misión',m:'Siervo, esclavo',d:'Pablo se presenta así: siervo de Jesucristo. Pertenecer a Cristo es la mayor libertad.',ref:'Romanos 1:1'},
 teleios:{o:'τέλειος',tr:'téleios',lang:'Griego',c:'Vida cristiana',m:'Perfecto: maduro, completo',d:'No significa «sin fallos», sino maduro, que ha llegado a su meta. El propósito es llegar a la estatura de Cristo.',ref:'Efesios 4:13'},
 metamorphoo:{o:'μεταμορφόω',tr:'metamorphóō',lang:'Griego',c:'Vida cristiana',m:'Transformar',d:'De aquí viene «metamorfosis». Es la palabra de la transfiguración de Jesús y de nuestra transformación interior.',ref:'Romanos 12:2'},
 nous:{o:'νοῦς',tr:'noûs',lang:'Griego',c:'Vida cristiana',m:'Mente, entendimiento',d:'La forma de pensar y de juzgar. Dios la renueva para que veamos el mundo como Él lo ve.',ref:'Romanos 12:2'},
 kardia:{o:'καρδία',tr:'kardía',lang:'Griego',c:'Vida cristiana',m:'Corazón',d:'Como el hebreo lev, es el centro de la persona: pensamientos, deseos y decisiones.',ref:'Mateo 5:8'},
 psyche:{o:'ψυχή',tr:'psychḗ',lang:'Griego',c:'Vida cristiana',m:'Alma, vida',d:'La vida de la persona. ¿De qué le sirve al hombre ganar el mundo si pierde su alma?',ref:'Mateo 16:26'},
 soma:{o:'σῶμα',tr:'sôma',lang:'Griego',c:'Vida cristiana',m:'Cuerpo',d:'El cuerpo del creyente es templo del Espíritu Santo. También es la imagen de la iglesia: el cuerpo de Cristo.',ref:'1 Corintios 6:19'},
 kosmos:{o:'κόσμος',tr:'kósmos',lang:'Griego',c:'Salvación',m:'Mundo',d:'Puede ser la creación, la humanidad o el sistema que vive sin Dios. De tal manera amó Dios al kósmos…',ref:'Juan 3:16'},
 hagios:{o:'ἅγιος',tr:'hágios',lang:'Griego',c:'Dios',m:'Santo, apartado',d:'Pablo llama «santos» a todos los creyentes: no porque sean perfectos, sino porque Dios los ha apartado para sí.',ref:'1 Pedro 1:16'},
 episkopos:{o:'ἐπίσκοπος',tr:'epískopos',lang:'Griego',c:'Iglesia y misión',m:'Obispo: supervisor',d:'El que vela por la iglesia. Junto con «anciano» y «pastor» describe a quienes cuidan del rebaño.',ref:'1 Timoteo 3:1'},
 presbyteros:{o:'πρεσβύτερος',tr:'presbýteros',lang:'Griego',c:'Iglesia y misión',m:'Anciano',d:'Un creyente maduro que guía la iglesia local con su ejemplo y su enseñanza.',ref:'Tito 1:5'},
 charisma:{o:'χάρισμα',tr:'chárisma',lang:'Griego',c:'Iglesia y misión',m:'Don: regalo de gracia',d:'De la misma raíz que járis. Son capacidades que Dios da para servir a los demás en el cuerpo de Cristo.',ref:'1 Corintios 12:4'},
 oikodome:{o:'οἰκοδομή',tr:'oikodomḗ',lang:'Griego',c:'Iglesia y misión',m:'Edificación',d:'Construir una casa. Los dones y las palabras sirven para edificar a los hermanos.',ref:'Efesios 4:12'},
 parrhesia:{o:'παρρησία',tr:'parrēsía',lang:'Griego',c:'Iglesia y misión',m:'Valentía, confianza para hablar',d:'Hablar con libertad y sin miedo. Los discípulos oraron y fueron llenos del Espíritu para hablar con parrēsía.',ref:'Hechos 4:31'},
 hypakoe:{o:'ὑπακοή',tr:'hypakoḗ',lang:'Griego',c:'Vida cristiana',m:'Obediencia: escuchar desde abajo',d:'Literalmente «escuchar debajo de»: escuchar con disposición a obedecer. La fe verdadera lleva a la obediencia.',ref:'Romanos 1:5'},
 peirasmos:{o:'πειρασμός',tr:'peirasmós',lang:'Griego',c:'Vida cristiana',m:'Prueba, tentación',d:'La misma palabra sirve para prueba y para tentación: lo que puede hacerte caer o hacerte crecer.',ref:'1 Corintios 10:13'},
 hypokrites:{o:'ὑποκριτής',tr:'hypokritḗs',lang:'Griego',c:'Vida cristiana',m:'Hipócrita: actor',d:'Era el actor que actuaba tras una máscara. Jesús lo usa para quien ora o da limosna para ser visto.',ref:'Mateo 6:5'},
 skandalon:{o:'σκάνδαλον',tr:'skándalon',lang:'Griego',c:'Salvación',m:'Tropiezo, escándalo',d:'La pieza de una trampa que se dispara. La cruz es tropiezo para los que buscan salvarse a su manera.',ref:'1 Corintios 1:23'},
 rhema:{o:'ῥῆμα',tr:'rhḗma',lang:'Griego',c:'Vida cristiana',m:'Palabra dicha',d:'Una palabra pronunciada. La espada del Espíritu es la palabra de Dios que se cree y se dice en el momento justo.',ref:'Efesios 6:17'},
 stauros:{o:'σταυρός',tr:'staurós',lang:'Griego',c:'Salvación',m:'Cruz',d:'El instrumento de ejecución más vergonzoso del imperio romano se convirtió en el lugar del amor de Dios.',ref:'Gálatas 6:14'},
 haima:{o:'αἷμα',tr:'haîma',lang:'Griego',c:'Salvación',m:'Sangre',d:'La vida entregada. Sin derramamiento de sangre no hay perdón; la sangre de Cristo nos limpia de todo pecado.',ref:'1 Juan 1:7'},
 katallage:{o:'καταλλαγή',tr:'katallagḗ',lang:'Griego',c:'Salvación',m:'Reconciliación',d:'Hacer amigos de nuevo a dos enemigos. Dios nos reconcilió consigo mismo por Cristo, y nos dio ese mensaje.',ref:'2 Corintios 5:18'},
 aphesis:{o:'ἄφεσις',tr:'áphesis',lang:'Griego',c:'Salvación',m:'Perdón: soltar',d:'Soltar, liberar, cancelar una deuda. En Cristo tenemos el perdón de los pecados.',ref:'Efesios 1:7'},
 pleroo:{o:'πληρόω',tr:'plēróō',lang:'Griego',c:'Vida cristiana',m:'Llenar, cumplir',d:'Sed llenos del Espíritu: un llenarse continuo, día a día. También es la palabra de las profecías cumplidas.',ref:'Efesios 5:18'},
 homologeo:{o:'ὁμολογέω',tr:'homologéō',lang:'Griego',c:'Oración y adoración',m:'Confesar: decir lo mismo',d:'Confesar el pecado es decir lo mismo que Dios dice de él. Y confesar a Cristo es declarar públicamente que es el Señor.',ref:'1 Juan 1:9'},
 eulogia:{o:'εὐλογία',tr:'eulogía',lang:'Griego',c:'Oración y adoración',m:'Bendición: buena palabra',d:'Literalmente «hablar bien». Dios nos ha bendecido con toda bendición espiritual en Cristo.',ref:'Efesios 1:3'},
 meno:{o:'μένω',tr:'ménō',lang:'Griego',c:'Vida cristiana',m:'Permanecer, quedarse',d:'Palabra clave en Juan 15: quedarse unido a la vid, habitar en Cristo y dejar que su Palabra habite en ti.',ref:'Juan 15:4'},
 hilaros:{o:'ἱλαρός',tr:'hilarós',lang:'Griego',c:'Carácter',m:'Alegre',d:'De aquí viene «hilarante». Dios ama al que da con alegría, no por obligación.',ref:'2 Corintios 9:7'},
 pistos:{o:'πιστός',tr:'pistós',lang:'Griego',c:'Carácter',m:'Fiel, digno de confianza',d:'Dios es fiel, y llama a sus siervos a ser fieles en lo poco y en lo mucho.',ref:'1 Corintios 1:9'},
 ekklesia2:{o:'κοινωνία τοῦ ἁγίου πνεύματος',tr:'koinōnía toû hagíou pneúmatos',lang:'Griego',c:'Iglesia y misión',m:'La comunión del Espíritu Santo',d:'Pablo termina 2 Corintios bendiciendo con la gracia de Cristo, el amor del Padre y la comunión del Espíritu: la Trinidad en una frase.',ref:'2 Corintios 13:14'},
 kyrie:{o:'Κύριε ἐλέησον',tr:'Kýrie eléēson',lang:'Griego',c:'Oración y adoración',m:'Señor, ten misericordia',d:'El clamor de los ciegos y de la mujer cananea a Jesús. La iglesia lo ha orado durante siglos.',ref:'Mateo 15:22'},
 parousia2:{o:'ἀρραβών',tr:'arrabṓn',lang:'Griego',c:'Salvación',m:'Arras: anticipo, garantía',d:'El primer pago que garantiza el resto. El Espíritu Santo es las arras de nuestra herencia.',ref:'Efesios 1:14'},
 mysterion:{o:'μυστήριον',tr:'mystḗrion',lang:'Griego',c:'Salvación',m:'Misterio: algo revelado',d:'En la Biblia no es algo incomprensible, sino algo antes oculto que Dios ahora ha revelado: Cristo en vosotros, la esperanza de gloria.',ref:'Colosenses 1:27'},
 sophia:{o:'σοφία',tr:'sophía',lang:'Griego',c:'Vida cristiana',m:'Sabiduría',d:'Cristo es la sabiduría de Dios. Y si alguno tiene falta de sabiduría, que la pida a Dios.',ref:'Santiago 1:5'},
 gnosis:{o:'γνῶσις',tr:'gnôsis',lang:'Griego',c:'Vida cristiana',m:'Conocimiento',d:'Es bueno, pero el conocimiento solo envanece; el amor edifica. Conocer a Dios es conocerle de verdad, no solo saber cosas.',ref:'1 Corintios 8:1'},
 hamartolos:{o:'ἁμαρτωλός',tr:'hamartōlós',lang:'Griego',c:'Salvación',m:'Pecador',d:'Jesús vino a salvar a los pecadores, y Pablo se llamaba a sí mismo el primero de ellos.',ref:'1 Timoteo 1:15'},
 basileia:{o:'βασιλεία',tr:'basileía',lang:'Griego',c:'Iglesia y misión',m:'Reino, reinado',d:'Más que un territorio, es el reinado de Dios. Jesús anunció que con Él el reino de Dios se había acercado.',ref:'Marcos 1:15'},

/* Modo web (Netlify): los grupos se guardan en el servidor de la propia web, con el código de grupo */
function netDB(){
  const L={members:[],peticiones:[],animos:[]};let timer=null;
  async function api(body){const r=await fetch('/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('api '+r.status);return r.json();}
  function emit(g){
    const mem=Object.entries(g.members||{}).map(([id,m])=>({id,data:()=>Object.assign({},m,{group:S.group})}));
    const pets=Object.entries(g.pets||{}).map(([id,p])=>({id,data:()=>Object.assign({},p,{group:S.group})}));
    const an=(g.animos||[]).map((a,i)=>({id:'a'+i,data:()=>a}));POSTS=Object.entries(g.posts||{}).map(([id,p])=>Object.assign({id},p));const nr=g.reto||null;if(JSON.stringify(nr)!==JSON.stringify(RETO)){RETO=nr;setTimeout(sync,50);}
    L.members.forEach(f=>f({docs:mem}));L.peticiones.forEach(f=>f({docs:pets}));L.animos.forEach(f=>f({docs:an}));
  }
  async function poll(){if(!S.group){emit({});return;}try{emit(await api({action:'get',code:S.group,uid:UID}));}catch(e){}}
  function start(){if(timer)return;poll();timer=setInterval(()=>{if(!document.hidden&&navigator.onLine!==false)poll();},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});window.addEventListener('online',()=>{sync();poll();});}
  return {refresh:poll,
    doc(path){const p=path.split('/'),c=p[0],id=p[1];return{
      async get(){if(c==='grupos'){const g=await api({action:'get',code:id,uid:UID});return{exists:!!g.name,data:()=>g.name?{name:g.name}:undefined};}return{exists:false,data:()=>undefined};},
      async set(d){
        if(c==='members'){if(d.group)await api({action:'sync',code:d.group,uid:UID,member:d});return;}
        if(c==='grupos'){await api({action:'create',code:id,name:d.name,uid:UID});return;}
        if(c==='peticiones'){if(!d.group)throw new Error('nogroup');await api({action:'pet',code:d.group,id,pet:{t:d.t,name:d.name,by:UID}});poll();return;}
      },
      async update(d){if(c==='peticiones'&&S.group){if('oran' in d)await api({action:'pray',code:S.group,id,uid:UID});if(d.answered)await api({action:'answer',code:S.group,id});poll();}},
      onSnapshot(){return()=>{};}
    };},
    collection(path){const q={onSnapshot(cb){(L[path]||(L[path]=[])).push(cb);start();return()=>{};},where(){return q;},
      async add(d){if(path==='animos'&&S.group)await api({action:'animo',code:S.group,to:d.to,a:d});poll();}};return q;}
  };
}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function'){
    if(!/^https?:$/.test(location.protocol))return;
    try{const r=await fetch('/api',{method:'POST',headers:{'content-type':'application/json'},body:'{"action":"ping"}'});if(!r.ok)return;const j=await r.json();if(!j.ok)return;}catch(e){return;}
    DB=netDB();UID=S.uid;
    DB.collection('members').onSnapshot(q=>{MEMBERS=q.docs.map(x=>Object.assign({id:x.id},x.data()));onCloud();});
    DB.collection('peticiones').onSnapshot(q=>{PETS=q.docs.map(x=>Object.assign({id:x.id},x.data()));onCloud();});
    DB.collection('animos').where('to','==',UID).onSnapshot(q=>{ANIMOS=q.docs.map(x=>x.data());onCloud();});
    if(S.name)sync();onCloud();return;
  }
  try{
    const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;const id=await user.id();if(!id)return;
    DB=db;USER=user;UID=id;
    try{const snap=await db.doc('data/users/'+id+'/state').get();if(snap.exists){const r=snap.data();if(r&&r.s&&(r.at||0)>(S.at||0)){S=Object.assign(fresh(),JSON.parse(r.s));localSave();if(stack[stack.length-1]===sWelcome&&S.name)closeAll();}}}catch(e){}
    db.collection('members').onSnapshot(q=>{MEMBERS=q.docs.map(x=>Object.assign({id:x.id},x.data()));onCloud();},()=>{});
    db.collection('peticiones').onSnapshot(q=>{PETS=q.docs.map(x=>Object.assign({id:x.id},x.data()));onCloud();},()=>{});
    db.collection('animos').where('to','==',id).onSnapshot(q=>{ANIMOS=q.docs.map(x=>x.data()).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,10);onCloud();},()=>{});
    if(S.name)sync();
    onCloud();
  }catch(e){}
}

  return hero('roca','El evangelio','Cristo, la piedra angular','ef2-20')+`<div class="stack" style="--k:var(--c-roca)">
   <div class="card"><p>Todo en Arraigados crece desde aquí. Las raíces de tu árbol no se agarran a tu esfuerzo, sino a Cristo. Nadie puede poner otro fundamento (1 Corintios 3:11). Quien oye sus palabras y las hace es como el que edificó su casa sobre la roca (Mateo 7:24-25).</p></div>
   <div class="card"><div class="eyebrow" style="margin-bottom:12px">El evangelio en cuatro pasos</div><div class="gospel">
    <div><p><b>Dios te ama y te creó para Él.</b> De tal manera amó Dios al mundo que dio a su Hijo (Juan 3:16).</p></div>
    <div><p><b>El pecado nos separa de Dios.</b> Todos pecamos y estamos lejos de su gloria, y la paga del pecado es muerte (Romanos 3:23; 6:23).</p></div>
    <div><p><b>Cristo murió y resucitó por ti.</b> Murió por nuestros pecados, fue sepultado y resucitó al tercer día (1 Corintios 15:3-4). Él es el camino (Juan 14:6).</p></div>
    <div><p><b>Recíbele por la fe.</b> A todos los que le recibieron les dio potestad de ser hechos hijos de Dios (Juan 1:12). Arrepiéntete y cree (Marcos 1:15).</p></div></div></div>
   <div class="btn-row"><button class="btn" style="--k:var(--c-cree)" data-a="go" data-id="cree">Lo que creemos</button><button class="btn" style="--k:var(--c-raz)" data-a="go" data-id="raz">Razones para creer</button></div>
   <div class="card"><div class="eyebrow">Si nunca le has entregado tu vida</div><p style="margin-top:8px">Puedes hablar con Dios ahora mismo, con tus palabras: reconoce tu pecado, cree que Jesús murió y resucitó por ti, y pídele que sea tu Señor. Después cuéntaselo a un cristiano o a un pastor: no tienes que caminar solo.</p>
    <button class="btn full" style="margin-top:12px" data-a="lesson" data-id="gracia">Empezar por la gracia</button></div>
   <div class="card"><div class="eyebrow">Compártelo</div><p class="small" style="margin-top:6px">Copia el evangelio en cuatro pasos para enviarlo a alguien.</p>
    <textarea class="code" id="gostxt" readonly style="margin-top:10px;font-family:var(--f-ui);font-size:.85rem">${esc(gospelText())}</textarea><button class="btn soft full" style="margin-top:8px" data-a="copy" data-id="gostxt">Copiar</button></div></div>`;
}
function gospelText(){return 'La buena noticia de Jesús\n\n1. Dios te ama y te creó para Él (Juan 3:16).\n2. El pecado nos separa de Dios (Romanos 3:23; 6:23).\n3. Cristo murió por nuestros pecados y resucitó (1 Corintios 15:3-4).\n4. Recíbele por la fe: arrepiéntete y cree (Juan 1:12; Marcos 1:15).\n\n¿Quieres que hablemos de ello?';}

/* --- Fruto y etapas --- */
function sFruto(){
  const si=stageIdx(),sg=STAGES[si],nx=STAGES[si+1],vi=VIRTUDES[Math.floor(Date.now()/864e5/7)%8];
  let bars='';
  if(nx){const r=nx.req,b=(l,v,m)=>'<div><div class="bar-l"><span>'+l+'</span><span>'+Math.min(v,m)+' / '+m+'</span></div><div class="bar"><i style="width:'+Math.min(100,v/m*100)+'%"></i></div></div>';
    bars='<p class="small muted" style="margin:12px 0 8px">Hacia «'+nx.n+'»</p><div class="bars">'+b('Raíces (lecciones)',lessonsDone(),r.L)+b('Hojas (versículos guardados)',learned(),r.V)+b('Días con Dios',totalActive(),r.A)+'</div>';}
  const fr=['Caridad','Gozo','Paz','Tolerancia','Benignidad','Bondad','Fe','Mansedumbre','Templanza'];
  return hero('fruto','Mi crecimiento','Un árbol que da fruto a su tiempo','gal5-22')+`<div class="stack" style="--k:var(--c-fruto)">
   <div class="card"><div class="eyebrow">Tu etapa · ${sg.ref}</div><h2 style="font-size:1.6rem;margin-top:6px">${sg.n}</h2><p style="margin-top:6px">${sg.d}</p>${bars}
    <p class="small muted" style="margin-top:12px">Las etapas siguen 1 Juan 2:12-14. No miden tu valor ante Dios: son una forma de ver hacia dónde crecer.</p></div>
   <div class="card"><div class="eyebrow">Virtud de la semana · 2 Pedro 1:5-7</div><h2 style="font-size:1.5rem;margin-top:6px">${vi[0]}</h2><p class="small muted">${vi[1]}</p><p style="margin-top:10px">${vi[2]}</p></div>
   <div class="card"><div class="eyebrow" style="margin-bottom:10px">El fruto del Espíritu</div><div class="fruits">${fr.map(x=>'<div class="fr"><i></i>'+x+'</div>').join('')}</div>
    <p class="small muted" style="margin-top:12px">Es fruto, no esfuerzo: crece permaneciendo en Cristo (Juan 15:5). Los frutos de tu árbol aparecen con los días que pasas con Él.</p></div></div>`;
}

/* --- Discipulado --- */
function myCode(){
  const o={u:S.uid,n:S.name||'Sin nombre',s:stageIdx(),L:lessonsDone(),V:learned(),A:totalActive(),k:streakInfo().n,p:Object.keys(S.stones).length,r:planIdx(),d:today(),dc:(S.disciples||[]).length,g2:(S.disciples||[]).reduce((a,x)=>a+(x.dc||0),0)};
  try{return 'ARR1.'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));}catch(e){return '';}
}
function parseCode(c){try{c=c.trim();if(!c.startsWith('ARR1.'))return null;const o=JSON.parse(decodeURIComponent(escape(atob(c.slice(5)))));return o&&o.u?o:null;}catch(e){return null;}}

     ${coopCard(MEMBERS)}

      ${ms.map(m=>{const mine=m.id===UID,isD=m.mentor===UID;return '<div class="dcard"><span class="avatar">'+esc((m.name||'?').slice(0,1).toUpperCase())+'</span><div style="flex:1;min-width:0"><b>'+esc(m.name||'Sin nombre')+(mine?' <span class="muted small">(tú)</span>':'')+(isD?' <span class="pill">Tu discípulo</span>':'')+(m.id===S.mentorId?' <span class="pill">Tu mentor</span>':'')+'</b><div class="small muted">'+STAGES[m.stage||0].n+' · '+(m.streak||0)+(m.streak===1?' día':' días')+' de constancia · '+(m.L||0)+' lecciones · '+(m.V||0)+' versículos</div><div class="small muted" style="display:flex;align-items:center;gap:8px;margin-top:2px">'+dots(m)+'<span>Activo '+ago(m)+(m.read?' · leyendo '+esc(m.read):'')+'</span></div></div>'+(mine?'':'<button class="btn soft sm" data-a="animar" data-id="'+esc(m.id)+'">Animar</button>')+'</div>'+(mine?'':'<div id="ank-'+esc(m.id)+'"></div>');}).join('')}

function coopCard(ms){
  const t=today(),fresh=ms.filter(m=>m.day&&m.day>=addDays(t,-6)),sum=fresh.reduce((a,m)=>a+Math.min(7,m.w||0),0),goal=Math.max(5,ms.length*5),pct=Math.min(100,Math.round(sum/goal*100));
  return '<div class="card coop"><div class="eyebrow">Meta del grupo · esta semana</div><h2 style="margin-top:6px">Entre todos: '+sum+' de '+goal+' días con Dios</h2><div class="bar"><i style="width:'+pct+'%"></i></div>'+
   '<p class="small muted" style="margin-top:8px">'+(pct>=100?'¡Meta cumplida! Dad gracias juntos. ':'Cada día que alguien busca a Dios, sumáis todos. ')+'Sin rankings.</p></div>';
}
function notifPrompt(){const n=notif();if(n.group||!pushOK()||(isIOS()&&!isStandalone()))return '';return '<div class="card notif"><b>Entérate al momento</b><p class="small muted" style="margin-top:4px">Activa los avisos del grupo para saber cuándo oran por ti o te animan.</p><button class="btn sm" style="margin-top:10px" data-a="ntog" data-id="group">Activar avisos del grupo</button></div>';}
function meetingCard(){
  const wk=Math.floor(dayN()/7),ps=PASAJES[(wk*7+3)%PASAJES.length],vi=VIRTUDES[wk%8];
  return '<details class="card meet"><summary><div class="eyebrow">Reunión de esta semana</div><h2 style="margin-top:6px">'+esc(ps[1])+'</h2><p class="small muted">'+esc(ps[0])+' · toca para ver la guía</p></summary>'+
   '<div class="steps4"><div><b>1 · Orad al empezar (5 min)</b><p>Una persona da gracias por la semana y pide que el Espíritu abra vuestro entendimiento.</p></div>'+
   '<div><b>2 · Leed juntos (10 min)</b><p>Leed '+esc(ps[0])+' en voz alta, dos veces, con lectores distintos. <a href="'+bg(ps[0])+'" target="_blank" rel="noopener">Abrir pasaje</a></p></div>'+
   '<div><b>3 · Conversad (20 min)</b><p>· ¿Qué nos enseña este pasaje sobre Dios?<br>· ¿Qué nos enseña sobre nosotros?<br>· ¿Qué vamos a obedecer esta semana, en concreto?</p></div>'+
   '<div><b>4 · Rendid cuentas con cariño (10 min)</b><p>¿Cómo va la constancia de cada uno? Repasad la virtud de la semana: <b>'+esc(vi[0])+'</b>. '+esc(vi[2])+'</p></div>'+

}

function parseRefs(str){
  const out=[];
  for(const part of String(str).split(/;\s*/)){
    const m=part.trim().match(/^(.+?)\s+(\d+)(?::(\d+)(?:-(\d+))?|-(\d+))?$/);if(!m)continue;
    const b=bookIdx(m[1].trim());if(b<0)continue;const c=+m[2];
    if(m[5]){for(let x=c;x<=+m[5]&&x<=BOOKS[b][1];x++)out.push([b,x]);}
    else out.push(m[3]?[b,c,+m[3],+(m[4]||m[3])]:[b,c]);
  }
  return out.filter(x=>x[1]>=1&&x[1]<=BOOKS[x[0]][1]);
}
function openRef(str){
  const R=parseRefs(str);if(!R.length)return false;
  const q=R.length>1?R.map(x=>[x[0],x[1]]):null;
  RD.focus=R[0][2]?[R[0][2],R[0][3]]:null;
  openReader(R[0][0],R[0][1],q);RD.queueRead=false;return true;
}

  let q='';try{q=new URL(a.href).searchParams.get('search')||'';}catch(_){}
  if(q&&parseRefs(q).length){e.preventDefault();e.stopPropagation();openRef(q);}
},true);

}

async function recToggle(){

    try{await aPut(id,blob);n.audio=n.audio||[];n.audio.push({id,d:today(),s:Math.round((Date.now()-t0)/1000),type:blob.type});save();}catch(e){showNote('No se pudo guardar','Puede que no quede espacio en el teléfono.');}draw(false);};

  o+=ann(286,cyc+22,'r',oraLy,'ORAR',d.pray?'Hecho hoy':'Pendiente','oracion',!d.pray,'oracion','rain');
  o+=ann(memTip[0],memTip[1],'r',memLy,'MEMORIZAR',nv?(nv+(nv===1?' versículo':' versículos')):'Empieza','memoria',due>0||nv===0,'memoria','leaf');
  o+=ann(sx[0],G-10,'r',disLy,'MI GRUPO',nd?String(nd):'Invitar','disc',false,'disc','sprout');

  o+=ann(ends[0][0],ends[0][1],'l',raiLy,'LECCIONES',L+' de '+LESSONS.length,'fund',!!LESSONS.find(l=>!S.lessons[l.id])&&!d.lesson,'fund','roots');
  o+='<g class="tag" data-a="go" data-id="roca" role="button" tabindex="0" aria-label="El evangelio: Cristo, la Roca"><rect x="120" y="442" width="160" height="28" rx="14" fill="'+PP.pill+'" stroke="'+PP.line+'"/><text x="200" y="460" text-anchor="middle" font-family="Figtree, system-ui, sans-serif" font-size="9.5" font-weight="800" letter-spacing="1.5" fill="'+CREAM+'">CRISTO, LA ROCA</text></g>';
  return o+'</svg>';
}
